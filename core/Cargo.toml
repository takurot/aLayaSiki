[package]
name = "alayasiki-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rkyv = { version = "0.8.17", features = ["std", "bytecheck"] }
bytes = "1.0"
sha2 = "0.10"
jsonwebtoken = "9.3"

[dev-dependencies]
tempfile = "3.3"
