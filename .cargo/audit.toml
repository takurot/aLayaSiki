[advisories]
ignore = [
    # RUSTSEC-2026-0187 — lopdf 0.34.0 (via ingestion -> pdf-extract) stack
    # overflow / DoS on deeply nested PDF objects. Reachable: pdf-extract is
    # used by `ingestion::extract::extract_pdf_text` to parse bytes from
    # ingested documents, which may originate from untrusted uploads. No
    # upstream fix available yet. Issue #85 hardened CI/repo config but does
    # not itself resolve this advisory and will be closed independently of
    # it — a dedicated follow-up issue must be opened (or an existing one
    # cited here) before the next re-review so this waiver keeps a live
    # tracker instead of pointing at a closed issue.
    # Reviewed: 2026-10-01. Re-review by: 2027-01-01.
    "RUSTSEC-2026-0187",
    # RUSTSEC-2026-0190 — anyhow 1.0.100 unsoundness in `downcast_mut`.
    # Exposure: anyhow is a direct dependency of ingestion/jobs/slm, but this
    # codebase does not call `Error::downcast_mut` (verified via repo-wide
    # grep), so the unsound path is not exercised by our code. Transitive
    # crates could still reach it; re-check on dependency upgrades. Issue
    # #85 hardened CI/repo config but does not itself resolve this advisory
    # and will be closed independently of it — a dedicated follow-up issue
    # must be opened (or an existing one cited here) before the next
    # re-review so this waiver keeps a live tracker instead of pointing at a
    # closed issue.
    # Reviewed: 2026-10-01. Re-review by: 2027-01-01.
    "RUSTSEC-2026-0190",
]
