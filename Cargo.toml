[workspace]
members = [
    "core",
    "storage",
    "ingestion",
    "slm",
    "jobs",
    "query",
    "sdk",
    "prototypes",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "aLayaSiki: an autonomous GraphRAG database prototype"

[workspace.dependencies]
alayasiki-core = { path = "core" }
storage = { path = "storage" }
ingestion = { path = "ingestion" }
slm = { path = "slm" }
jobs = { path = "jobs" }
query = { path = "query" }

anyhow = "1.0"
async-trait = "0.1"
dashmap = "5.5"
jsonwebtoken = "9.3"
rkyv = { version = "0.8.17", features = ["std", "bytecheck"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.3"
thiserror = "1.0"
tokio = { version = "1.0" }
tracing = "0.1"
