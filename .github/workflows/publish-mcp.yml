name: MCP wheels
on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock
      - mcp/pyproject.toml
      - docs/MCP.md
      - scripts/smoke_mcp_wheel.py
      - .github/workflows/publish-mcp.yml
  push:
    tags: ['mcp-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RUSTFLAGS: ""
      CXXFLAGS: ""
      # usearch 2.24 references POSIX MAP_FAILED in its Windows allocator.
      # VirtualAlloc fails with NULL; this preserves the existing failure check.
      # Remove after upgrading to the fix: https://github.com/unum-cloud/USearch/pull/742
      CXXFLAGS_x86_64_pc_windows_msvc: /DMAP_FAILED=0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: wheel-${{ matrix.target }}
      - name: Validate release version
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          project = tomllib.loads(Path('mcp/pyproject.toml').read_text())['project']['version']
          crate = tomllib.loads(Path('mcp/Cargo.toml').read_text())['package']['version']
          assert project == crate, (project, crate)
          for license in ("LICENSE-MIT", "LICENSE-APACHE"):
              assert Path(license).read_bytes() == Path("mcp", license).read_bytes()
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == f'mcp-v{project}'
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --manifest-path mcp/Cargo.toml --out dist
      - name: Install wheel
        shell: python
        run: |
          import subprocess, sys
          from pathlib import Path
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheels[0])], check=True)
      - name: Smoke installed wheel
        run: python scripts/smoke_mcp_wheel.py -- alayasiki-mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
  publish:
    name: Publish MCP to PyPI
    if: startsWith(github.ref, 'refs/tags/mcp-v') && github.event_name == 'push'
    needs: wheels
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish tested wheels using OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
